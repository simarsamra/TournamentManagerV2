name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 3.11 is the version the suite is verified against; requirements.txt
      # pins Django to the 5.2 LTS series.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      # Fails if a model change was committed without its migration. Without
      # this, the mismatch only surfaces when someone next runs migrate.
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --verbosity=2

      # Runs the checks that only apply outside DEBUG: cookie flags, HSTS,
      # SSL redirect, and the guard that refuses to boot on the committed
      # fallback SECRET_KEY. The key here is a throwaway for this run only.
      - name: Deployment checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.com
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING

      # The fallback SECRET_KEY must not be usable outside DEBUG. This asserts
      # the startup guard actually fires, rather than trusting that it does.
      - name: Insecure secret key is refused
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: ci.example.com
        run: |
          if python manage.py check 2>/dev/null; then
            echo "::error::startup succeeded with the committed fallback SECRET_KEY"
            exit 1
          fi
          echo "startup correctly refused the fallback key"

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SQLite hid a registration race behind table-level locking; PostgreSQL
    # commits both writers. The concurrency tests only run here, so this job is
    # the one that can catch that class of bug at all.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tournament_manager
          POSTGRES_USER: tm_user
          POSTGRES_PASSWORD: tm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DB_ENGINE: postgresql
      DJANGO_DB_NAME: tournament_manager
      DJANGO_DB_USER: tm_user
      DJANGO_DB_PASSWORD: tm_pass
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-postgres.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt

      - name: Migrations apply to an empty PostgreSQL database
        run: python manage.py migrate --no-input

      - name: Tests
        run: python manage.py test --verbosity=2
