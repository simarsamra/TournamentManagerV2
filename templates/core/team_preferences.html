{% extends "core/base.html" %}
{% block title %}Team Preferences{% endblock %}
{% block page_header %}Team Preferences{% endblock %}
{% block content %}
<h1 class="page-title">Preferences: {{ team_heading_label }}</h1>
<div class="card" style="max-width:600px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Preferred Courts</label>
                {{ form.preferred_courts }}
            </div>
            <div class="form-group">
                <label>Availability Notes</label>
                {{ form.availability_notes }}
            </div>
            <button type="submit" class="btn btn-primary">Save Preferences</button>
            <a href="{% url 'team_detail' pk=team.pk %}" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
