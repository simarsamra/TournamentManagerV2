# Recommended Ollama settings on a machine it shares with the website.
# Apply with:  sudo systemctl edit ollama   (paste the [Service] block), then
#              sudo systemctl restart ollama
[Service]
# Loopback only. Ollama has no authentication; never expose port 11434.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# One request at a time (the default). VRAM use grows with parallel x context.
Environment="OLLAMA_NUM_PARALLEL=1"
# Keep a single model in VRAM.
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Matches DJANGO_OLLAMA_NUM_CTX; the site also sends it with every request.
Environment="OLLAMA_CONTEXT_LENGTH=8192"
